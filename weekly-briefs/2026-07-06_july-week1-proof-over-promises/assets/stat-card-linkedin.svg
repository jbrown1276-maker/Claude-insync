  <!-- Background: InSync Blue -->
  <rect width="1200" height="627" fill="#032b43"/>

  <!-- Left edge accent bar — Medium Blue, subtle depth -->
  <rect x="0" y="0" width="6" height="627" fill="#044269"/>

  <!-- Primary stat: 70% — dominant, emotional center -->
  <!-- Large bold figure, vertically centered upper half -->
  <text
    x="100"
    y="248"
    font-family="Montserrat, 'Open Sans', Arial, sans-serif"
    font-weight="700"
    font-size="200"
    fill="#ffffff"
    letter-spacing="-4">70%</text>

  <!-- Secondary line: context for the stat -->
  <text
    x="100"
    y="308"
    font-family="Montserrat, 'Open Sans', Arial, sans-serif"
    font-weight="400"
    font-size="26"
    fill="#00b9f5"
    letter-spacing="0.5">of L&amp;D leaders are under pressure to prove training impact</text>

  <!-- Divider line — structured incompleteness motif -->
  <!-- Left segment: solid white line -->
  <line x1="100" y1="348" x2="540" y2="348" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
  <!-- Gap segment: Golden Honey — the missing element, the visual gap -->
  <line x1="540" y1="348" x2="640" y2="348" stroke="#eda113" stroke-width="2.5"/>
  <!-- Right segment: solid white line, fades -->
  <line x1="640" y1="348" x2="1100" y2="348" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>

  <!-- Small Golden Honey dot at gap start — punctuation for the gap -->
  <circle cx="540" cy="348" r="3.5" fill="#eda113"/>
  <!-- Small dot at gap end -->
  <circle cx="640" cy="348" r="3.5" fill="#eda113"/>

  <!-- Below divider: secondary stat — commanding but smaller than 70% -->
  <text
    x="100"
    y="418"
    font-family="Montserrat, 'Open Sans', Arial, sans-serif"
    font-weight="700"
    font-size="38"
    fill="#ffffff">Only 48% measure beyond completion.</text>

